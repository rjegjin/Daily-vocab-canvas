name: Daily Chinese Vocab Card

on:
  schedule:
    # 22:00 UTC = 07:00 KST
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        sudo apt-get install -y fonts-noto-cjk

    - name: Run script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        VOCAB_BOT_TOKEN: ${{ secrets.VOCAB_BOT_TOKEN }}
        VOCAB_CHAT_ID: ${{ secrets.VOCAB_CHAT_ID }}
      run: python chinese.py

    - name: Commit learned words
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add learned_zh.txt
        if ! git diff --staged --quiet; then
          git commit -m "chore: update learned_zh.txt [skip ci]"
          git push
        fi
