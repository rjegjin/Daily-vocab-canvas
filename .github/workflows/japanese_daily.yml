name: Daily Japanese Vocab Card

on:
  schedule:
    # 20:00 UTC = 05:00 KST
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        sudo apt-get install -y fonts-noto-cjk

    - name: Configure Google service account
      env:
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      run: |
        if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
          echo "GOOGLE_SERVICE_ACCOUNT_JSON secret is required for Imagen/Vertex AI" >&2
          exit 1
        fi
        printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service_key.json"
        echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service_key.json" >> "$GITHUB_ENV"

    - name: Run script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        VOCAB_BOT_TOKEN: ${{ secrets.VOCAB_BOT_TOKEN }}
        VOCAB_CHAT_ID: ${{ secrets.VOCAB_CHAT_ID }}
      run: python japanese.py

    - name: Commit learned words
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add learned_data_ja.json
        if ! git diff --staged --quiet; then
          git commit -m "chore: update Japanese learned data [skip ci]"
          git push
        fi
