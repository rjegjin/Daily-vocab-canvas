name: Daily Vocab Card Generator

on:
  schedule:
    # 20:00 UTC is 05:00 KST
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write # Required to commit back to the repository

jobs:
  generate-and-send:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetch all history so push works properly

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip' # Cache pip dependencies

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Configure Google service account
      env:
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      run: |
        if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
          echo "GOOGLE_SERVICE_ACCOUNT_JSON secret is required for Imagen/Vertex AI" >&2
          exit 1
        fi
        printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service_key.json"
        echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service_key.json" >> "$GITHUB_ENV"

    - name: Run script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        VOCAB_BOT_TOKEN: ${{ secrets.VOCAB_BOT_TOKEN }}
        VOCAB_CHAT_ID: ${{ secrets.VOCAB_CHAT_ID }}
      run: python spanish.py

    - name: Commit learned words update
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add learned_data_es.json
        
        # Check if there are any changes to commit
        if ! git diff --staged --quiet; then
          git commit -m "chore: update Spanish learned data [skip ci]"
          git push
        else
          echo "No changes to commit."
        fi
